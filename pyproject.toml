[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch-rl-notes"
version = "0.1.0"
description = "Cost models and figures for asynchronous RL resource allocation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.6",
    "pillow>=9.2",
]

[project.optional-dependencies]
dev = ["black==25.11.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["allocation", "continuous_allocation"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utils*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
